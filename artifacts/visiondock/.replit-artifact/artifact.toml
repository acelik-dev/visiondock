kind = "web"
previewPath = "/"
title = "VisionDock"
version = "1.0.0"
id = "artifacts/visiondock"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19124

[services.development]
run = "pnpm --filter @workspace/visiondock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/visiondock", "run", "build" ]
publicDir = "artifacts/visiondock/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19124"
BASE_PATH = "/"
